[project]
name = "agent-lab"
version = "0.1.0"
description = "A Python laboratory for learning controlled LLM agent runtimes."
requires-python = ">=3.12"
readme = "README.md"
license = "Apache-2.0"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
